<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intel News Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Intel News Board</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="news">News</button>
      <button class="tab-btn" data-tab="assessments">Assessments</button>
    </nav>
    <div class="filters" id="newsFilters">
      <select id="domainFilter"><option value="">All Domains</option></select>
      <select id="functionFilter"><option value="">All Joint Functions</option></select>
      <select id="typeFilter"><option value="">All Types</option></select>
      <input id="searchBox" type="text" placeholder="Search...">
    </div>
  </header>
  <main>
    <div id="newsPanel"><div id="cardList"></div></div>
    <div id="assessmentsPanel" class="hidden"><div id="assessmentsList"></div></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
